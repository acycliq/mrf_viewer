<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run comparison</title>
<!--
  A small viewer for comparing cell typing runs on the same cells: pciSeq at
  four mrf_beta values, and MapMyCells.

  It shows one picture at a time: the cells of one class (or of all classes),
  from all planes, for the run picked at the top right. The pictures were
  exported from pciSeq Viewer and live in images/<run id>/.

  Files:
    index.html      this page: the layout only
    styles.css      the look, with the palette of the pciSeq Viewer drawer
    data.js         the class list, colours and cell counts (window.BETA_VIEWER_DATA),
                    written by build_data.py
    zoomPan.js      zooming and dragging the picture
    drawer.js       opening and hiding the drawer, and resizing the class list
    app.js          the class list, the run picker and the fade between pictures
    build_data.py   rebuilds data.js from the pictures and the runs
    images/         one folder of pictures per run

  The scripts are plain scripts, not modules, because a browser refuses to load
  modules from a page opened straight from the disk. They are loaded in the
  order below: app.js uses what the three before it define.

  Open index.html straight from the disk; no server is needed.
-->
<link rel="stylesheet" href="styles.css">
</head>
<body class="drawer-collapsed">

<!-- The drawer lies over the picture. It starts hidden (the two "collapsed"
     classes, here and on the body); the rail on its edge opens and hides it,
     and Escape hides it. -->
<aside id="drawer" class="drawer collapsed" aria-label="Cell classes drawer">
    <div id="drawerRail" class="drawer-rail" role="button" tabindex="0" aria-label="Open or hide the drawer" title="Open the drawer">
        <span class="rail-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                <line x1="9" y1="4" x2="9" y2="20"></line>
                <polyline class="chevron" points="13,9 16,12 13,15"></polyline>
            </svg>
        </span>
    </div>
    <div class="drawer-content">
        <section class="drawer-section">
            <h1 class="drawer-title">&#9662; Cell Classes</h1>
            <input id="classFilter" class="class-filter" type="search" placeholder="Filter classes..." autocomplete="off" spellcheck="false">
            <ul id="classList" class="class-list"></ul>
            <div id="classListResizeHandle" class="list-resize-handle" title="Drag to make the list taller or shorter"></div>
        </section>
    </div>
</aside>

<main id="stage" class="stage">
    <!-- Everything inside the viewport zooms and moves together. -->
    <div id="viewport" class="viewport"></div>

    <fieldset class="run-picker">
        <legend>Run</legend>
        <div id="runOptions" class="run-options"></div>
    </fieldset>

    <div class="caption">
        <span id="captionColour" class="class-colour"></span>
        <span id="captionName"></span>
        <span id="captionDetail" class="caption-detail"></span>
    </div>

    <div class="zoom-buttons" role="group" aria-label="Zoom">
        <button id="zoomOutButton" type="button" title="Zoom out (-)" aria-label="Zoom out">&minus;</button>
        <button id="zoomResetButton" type="button" title="Back to the starting view (0, or double-click the picture)">Reset</button>
        <button id="zoomInButton" type="button" title="Zoom in (+)" aria-label="Zoom in">+</button>
    </div>
</main>

<script src="data.js"></script>
<script src="zoomPan.js"></script>
<script src="drawer.js"></script>
<script src="app.js"></script>
</body>
</html>
